[package]
name = "litmus"
version = "0.3.1"
edition = "2024"

[dependencies]
anstream = "0.6"
anstyle = "1"
rbx_binary = "3"
rbx_dom_weak = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
terminal_size = "0.4"
tiny_http = "0.12"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
