name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release per tag at a time; a second push of the same tag waits rather than racing it
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refuses a tag before anything builds: it must be on main, which only takes reviewed pull requests, and match the CLI's version
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git fetch --quiet origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which isn't on main; tag a commit that merged"
            exit 1
          fi

      - name: Check the tag against the CLI's version
        run: |
          version=$(grep -m1 '^version = ' cli/Cargo.toml | cut -d '"' -f 2)

          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but cli/Cargo.toml says $version"
            exit 1
          fi

  build:
    needs: check
    timeout-minutes: 45

    # Every system builds even when one fails, so a failed release shows all of its problems at once
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: windows
            runner: windows-latest
            targets: x86_64-pc-windows-msvc

          # One runner builds for both kinds of Mac, since macOS runners are the slowest to come by
          - system: macos
            runner: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin

          # Studio doesn't run here, but the workflows that test in the cloud do
          - system: linux
            runner: ubuntu-latest
            targets: x86_64-unknown-linux-gnu

    name: Build (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # The CLI's build script runs Rojo to build the plugin it carries
      - name: Install the tools
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Add the Rust targets
        run: rustup target add ${{ matrix.targets }}

      - name: Test
        working-directory: cli
        run: cargo test --locked

      - name: Build
        working-directory: cli
        run: |
          for target in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$target"
          done

      # Rokit picks an archive by the system named in it, and takes the file inside that is named after the tool
      - name: Archive
        run: |
          mkdir archives

          for target in ${{ matrix.targets }}; do
            # A target starts with its architecture, under the name Rokit knows it by
            archive="$GITHUB_WORKSPACE/archives/litmus-${GITHUB_REF_NAME#v}-${{ matrix.system }}-${target%%-*}.zip"

            pushd "cli/target/$target/release"

            if [ "$RUNNER_OS" = "Windows" ]; then
              7z a "$archive" litmus.exe
            else
              zip "$archive" litmus
            fi

            popd
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.system }}
          path: archives/*.zip

  # Runs only once every system has built, so a release never goes out with one missing
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" archives/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
