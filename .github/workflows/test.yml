name: Native Tests

on:
  pull_request:
    branches: [main, release]

permissions:
  contents: read

concurrency:
  group: native-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: native-tests-${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux
            runner: ubuntu-latest
          - system: macos
            runner: macos-latest
          - system: windows
            runner: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install the tools
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Update stable Rust
        run: rustup update stable --no-self-update

      - name: Test the CLI
        working-directory: cli
        run: rustup run stable cargo test --locked

      - name: Check the CLI
        working-directory: cli
        run: rustup run stable cargo clippy --locked --all-targets -- -D warnings

      - name: Build the CLI
        working-directory: cli
        run: rustup run stable cargo build --locked

      - name: Run the specs
        run: cli/target/debug/litmus test --standalone
